services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keystone-backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LLM_API_KEYS: ${LLM_API_KEYS:-placeholder_key_1,placeholder_key_2}
      LLM_MODEL: ${LLM_MODEL:-groq/openai/gpt-oss-20b}
      LLM_MODELS: ${LLM_MODELS:-groq/openai/gpt-oss-20b,groq/openai/gpt-oss-20b}
      DATABASE_URL: sqlite:////data/app.db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TYPE: ${CACHE_TYPE:-local}
      CACHE_DIR: /data/litellm_cache
      DEFAULT_SYSTEM_PROMPT: ${DEFAULT_SYSTEM_PROMPT:-You are a helpful, accurate, and concise AI assistant.}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: keystone-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
