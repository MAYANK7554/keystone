services:
  - type: web
    name: keystone-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: groq/openai/gpt-oss-20b
      - key: LLM_MODELS
        value: groq/openai/gpt-oss-20b,groq/openai/gpt-oss-20b
      - key: DATABASE_URL
        value: sqlite:////tmp/app.db
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: CACHE_ENABLED
        value: "true"
      - key: CACHE_TYPE
        value: local
